[project]
name = "agent-memory-rag"
version = "0.1.0"
description = "Tenant-scoped long-term memory and RAG infrastructure for agentic brand operations"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-openai>=0.1.0",
  "openai>=1.58.0",
  "httpx>=0.27.0",
  "ddgs>=9.11.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1"
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
